server:
  port: 8082

spring:
  application:
    name: api-gateway

  config:
    import:
      - "optional:configserver:http://localhost:9999"
      - optional:vault://

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
    vault:
      host: localhost
      port: 8200
      scheme: http
      token: hvs.IB7RvtNwphgLco9dZA3icKf7

      kv:
        enabled: true
        backend: kv
        default-context: credentials
        default-key: application


#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          secret-key: ${jwt.secret}


  profiles:
    active: k8s.local

logging:
  level:
    org.springframework.cloud.vault: DEBUG
    org.springframework.cloud.gateway: TRACE