plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '6.2.0.5505'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'org.owasp.dependencycheck' version '12.1.3'
	id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.digitalpayment'
version = '0.0.1-SNAPSHOT'

spotless {
	java {
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

	pitest {
		junit5PluginVersion = '1.2.2'

		targetClasses = ['com.digitalpayment.auth.*']

		targetTests = ['com.digitalpayment.auth.*']

		threads = 4

		outputFormats = ['HTML']

		timestampedReports = false

		excludedClasses = []

		//mutationThreshold = 80
	}

	jacoco {
		toolVersion = "0.8.13"
	}

	jacocoTestReport {
		dependsOn test

		reports {
			xml.required = true
			html.required = true
			csv.required = false
		}
	}

	jacocoTestCoverageVerification {

		violationRules {

			rule {

				/*limit {
                    minimum = 0.80
                }*/

			}

		}

	}

	sonar {
		properties {

			property "sonar.projectKey", "auth-service"

			property "sonar.projectName", "Auth Service"

			property "sonar.coverage.jacoco.xmlReportPaths",
					"${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
		}
	}

dependencyCheck {
	failBuildOnCVSS = 7
	formats = ['HTML', 'JSON']
	suppressionFile = 'dependency-check-suppressions.xml'
}

	repositories {
		mavenCentral()
	}

	ext {
		set('springCloudVersion', "2025.1.1")
	}

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.cloud:spring-cloud-starter-config'
		implementation 'org.springframework.boot:spring-boot-starter-webmvc'
		implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		implementation 'io.micrometer:micrometer-tracing-bridge-otel'
		implementation 'io.opentelemetry:opentelemetry-api'
		implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
		implementation 'io.micrometer:micrometer-registry-prometheus'
		implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
		implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
		implementation 'io.micrometer:micrometer-registry-otlp'
		implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.13.0-alpha'
		implementation 'io.opentelemetry:opentelemetry-api-incubator:1.55.0-alpha'

		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'

		runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
		runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
		implementation 'com.fasterxml.jackson.core:jackson-annotations'

		runtimeOnly 'org.postgresql:postgresql'
		developmentOnly 'org.springframework.boot:spring-boot-devtools'

		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
		testImplementation 'org.mockito:mockito-core'
		testImplementation 'org.junit.jupiter:junit-jupiter'
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		}
	}

	tasks.named('test') {
		useJUnitPlatform()
		finalizedBy jacocoTestReport
	}

	check.dependsOn jacocoTestCoverageVerification